<app-page>

    <div class="mx-auto flex w-full max-w-md flex-col gap-6">

        <div class="flex flex-col gap-1">
            <app-text text="Welcome back" text_size="2xl" />

            <app-text text="Sign in to your Atlas Copiae account" text_size="sm" text_color="black" />
        </div>

        <app-form [formGroup]="form" (submitted)="submit()">

            <div class="flex flex-col gap-4">

                <div class="flex flex-col gap-2">
                    <app-text text="Email" text_size="sm" />

                    <app-input type="email" name="email" placeholder="Enter your email" autocomplete="email"
                        formControlName="email" />
                </div>

                <div class="flex flex-col gap-2">
                    <app-text text="Password" text_size="sm" />

                    <app-input type="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" formControlName="password" />
                </div>

                <app-button type="submit" [loading]="submitting">
                    Sign in
                </app-button>

            </div>

        </app-form>

    </div>

</app-page>
