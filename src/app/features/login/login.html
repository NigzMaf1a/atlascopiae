<app-page className="flex justify-center items-center">
    <app-topstrip></app-topstrip>

    <div class="mx-auto flex flex-col w-full max-w-md gap-6 bg-white rounded-lg px-2 py-2">

        <div class="flex flex-col gap-1">
            <app-text text="Welcome back" text_size="2xl" text_position="center" text_color="blue" />

            <app-text text="Sign in to your Atlas Copiae account" text_size="sm" text_color="slate"
                text_position="center" />
        </div>

        <app-form [formGroup]="form" (submitted)="submit()">

            <div class="flex flex-col gap-4">

                <div class="flex flex-col gap-2">
                    <app-text text="Email" text_size="sm" />

                    <app-input type="email" name="email" placeholder="Enter your email" autocomplete="email"
                        formControlName="email" />
                </div>

                <div class="flex flex-col gap-2">
                    <app-text text="Password" text_size="sm" />

                    <app-input type="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" formControlName="password" />
                </div>

                <div class="w-full flex justify-center items-center">
                    <app-button type="submit" [loading]="submitting">
                        Sign in
                    </app-button>
                </div>

            </div>

        </app-form>

    </div>

</app-page>
