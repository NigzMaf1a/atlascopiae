<select [class]="styles()" [id]="id()" [name]="name()" [value]="value" [required]="required()" [disabled]="disabled"
    (change)="handleChange($event)" (blur)="handleBlur()">
    <option value="" disabled>
        {{ placeholder() }}
    </option>

    @for (option of options(); track option.value) {
    <option [value]="option.value">
        {{ option.label }}
    </option>
    }
</select>
